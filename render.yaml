services:
  - type: web
    name: swahili-plate
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: swahili-plate-db
          property: connectionString
      - key: ADMIN_TOKEN
        sync: false
      - key: ORDER_NOTIFICATION_WEBHOOK
        sync: false
      - key: CBD_BRANCH_PHONE
        value: "0711726448"
      - key: SARIT_BRANCH_PHONE
        value: "0773497954"

databases:
  - name: swahili-plate-db
    databaseName: swahili_plate
    user: swahili_plate